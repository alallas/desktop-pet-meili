[package]
name = "chaojiandai"
version = "0.0.1"
description = "潮间带 —— 住在桌面上的海洋收容所"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 不 bundled：本机 gcc 5.3 编译 sqlite3.c 必 ICE（踩坑档案坑 25），
# 链接 sqlite.org 官方预编译 sqlite3.dll（仅依赖 KERNEL32，导入库 dlltool 生成）。
# 路径由仓库根 .cargo/config.toml 的 SQLITE3_LIB_DIR / SQLITE3_INCLUDE_DIR 提供。
rusqlite = { version = "0.41", default-features = false }
# 显式关掉 libsqlite3-sys 默认的 bundled（它会编译 C 源码，本机 gcc 5.3 必 ICE，坑 25）；
# ≥0.39 修复 RUSTSEC-2026-0459（bundled 场景的 CVE；本工程链接官方 3.54.1 dll，双重规避）
libsqlite3-sys = { version = "0.39", default-features = false }
# 系统 API 绑定，版本与 tauri 内部使用的 windows-sys 0.61 保持一致（不引第二份）
windows-sys = { version = "0.61", features = [
    "Win32_UI_Accessibility",     # SetWinEventHook / UnhookWinEvent
    "Win32_UI_WindowsAndMessaging", # GetForegroundWindow / GetWindowTextW / GetWindowThreadProcessId
    "Win32_System_Threading",     # OpenProcess / QueryFullProcessImageNameW
    "Win32_System_ProcessStatus", # QueryProcessCycleTime?（备用）+ PSAPI 基础
    "Win32_UI_Input_KeyboardAndMouse", # GetLastInputInfo（空闲检测）
    "Win32_Foundation",
    "Win32_System_SystemInformation", # GetTickCount 备用
    "Win32_System_Power",             # GetSystemPowerStatus（电源采集）
    "Win32_System_RemoteDesktop",   # WTSRegisterSessionNotification（锁屏采集）
    "Win32_NetworkManagement_IpHelper", # NotifyAddrChange/GetAdaptersAddresses（网络采集）
    "Win32_NetworkManagement_Ndis",     # IpHelper 函数按项门控（GetAdaptersAddresses 需要）
    "Win32_Networking_WinSock",         # 同上（NDIS 结构引用的类型）
    "Win32_System_IO",                  # NotifyAddrChange 按项门控
] }
tracing = "0.1"
# tracing 落盘（桌面 exe 无控制台，不初始化 collector 的 info!/error! 全丢）
tracing-subscriber = "0.3"
# 麦克风采集（KWS/VAD 的音频源）。WASAPI 后端，MIT/Apache-2.0（白名单内）
cpal = "0.15"
# 本地 LLM 通信（llama-server 是 OpenAI 兼容 HTTP，只走 127.0.0.1）。MIT/Apache-2.0
# json feature：send_json/into_json；默认不带
# default-features = false：默认 tls（rustls）会把 webpki-roots（CDLA-Permissive-2.0）拖进许可检查，
# 而 llama-server 只走 127.0.0.1，根本用不到 TLS
ureq = { version = "2", default-features = false, features = ["json"] }
# WinRT（SMTC 媒体会话等）。版本与 wry 带入的 0.62.2 对齐共用；windows-sys 管 Win32，本 crate 管 WinRT
windows = { version = "0.62", features = ["Media_Control", "Foundation"] }
specta = { version = "2.0.0-rc.28", features = ["serde_json"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "2.0.0-rc.28", features = ["typescript", "derive"] }
thiserror = "1"
